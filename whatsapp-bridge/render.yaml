# Render Blueprint for the Safarmate WhatsApp bridge.
#
# On the free "Web Service" plan the container:
#   • sleeps after ~15 minutes of no HTTP traffic
#   • has NO persistent disk, so `.wwebjs_auth/` is wiped on every cold boot
#     → every wake-up needs a fresh QR scan (that's the design we're OK with)
#   • gets 512 MB RAM total (Chromium is tuned in Dockerfile / whatsappClient
#     for this ceiling; if it OOMs, upgrade to the $7/mo Starter plan, which
#     also gets you a persistent disk so re-scans stop being needed)
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. On https://dashboard.render.com → New → Blueprint → connect this repo
#      and point the "root directory" at `whatsapp-bridge`.
#   3. Set the WHATSAPP_BRIDGE_TOKEN secret when prompted (32-byte hex; same
#      value goes into your Safarmate server env as WHATSAPP_BRIDGE_TOKEN).
#   4. Deploy. Render will give you an HTTPS URL like
#      `https://safarmate-whatsapp.onrender.com` — put that in the Safarmate
#      server env as WHATSAPP_BRIDGE_URL.
#   5. Open Safarmate → Settings → WhatsApp reminders → scan the QR.

services:
  - type: web
    name: safarmate-whatsapp
    runtime: docker
    plan: free
    region: singapore          # closest free region to India
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_BRIDGE_TOKEN
        sync: false            # you set this in the Render dashboard
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5555
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WHATSAPP_SESSION_DIR
        value: /data/wwebjs_auth
