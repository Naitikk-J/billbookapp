# Render Blueprint for the Safarmate WhatsApp bridge (Baileys build).
#
# This file MUST live at the repo root — Render's Blueprint discovery looks
# for /render.yaml on the selected branch and nowhere else.
#
# We only deploy the whatsapp-bridge workspace here; the Safarmate client
# and server continue to deploy on Vercel.
#
# The bridge stores its WhatsApp session in MongoDB (see whatsappClient.ts +
# mongoAuth.ts), so the free-tier Render container can sleep, cold-boot, and
# restore the session automatically — no fresh QR scan after the first one.
#
# Both secrets are set in the Render dashboard when you deploy:
#   • WHATSAPP_BRIDGE_TOKEN  — 32-byte hex used by the Safarmate server to
#                              auth against the bridge.
#   • MONGODB_URI            — same Atlas connection string as the main
#                              Safarmate server. The bridge only touches
#                              the `whatsapp_session` collection.
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. On https://dashboard.render.com → New → Blueprint → connect this repo
#      (branch: main). Render will pick up this file automatically.
#   3. Paste the two secrets when prompted.
#   4. Deploy. Grab the URL Render assigns (e.g.
#      `https://safarmate-whatsapp.onrender.com`) and put it in the Safarmate
#      server env as WHATSAPP_BRIDGE_URL (same token as WHATSAPP_BRIDGE_TOKEN).
#   5. Open Safarmate → Settings → WhatsApp reminders → scan the QR.

services:
  - type: web
    name: safarmate-whatsapp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./whatsapp-bridge/Dockerfile
    dockerContext: ./whatsapp-bridge
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_BRIDGE_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5555
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_MONGO_COLLECTION
        value: whatsapp_session
