# Render Blueprint for the Safarmate WhatsApp bridge.
#
# This file MUST live at the repo root — Render's Blueprint discovery looks
# for /render.yaml on the selected branch and nowhere else.
#
# We only deploy the whatsapp-bridge workspace here; the Safarmate client
# and server continue to deploy on Vercel.
#
# On the free "Web Service" plan the container:
#   • sleeps after ~15 minutes of no HTTP traffic
#   • has NO persistent disk, so `.wwebjs_auth/` is wiped on every cold boot
#     → every wake-up needs a fresh QR scan (the design we're OK with)
#   • gets 512 MB RAM total (Chromium is tuned in whatsapp-bridge/Dockerfile
#     and whatsappClient.ts for this ceiling; if it OOMs, upgrade to the
#     $7/mo Starter plan, which also gets you a persistent disk so re-scans
#     stop being needed)
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. On https://dashboard.render.com → New → Blueprint → connect this repo
#      (branch: main). Render will pick up this file automatically.
#   3. When prompted, paste your 32-byte hex token into WHATSAPP_BRIDGE_TOKEN.
#      Generate one with:
#        node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   4. Deploy. Render will give you an HTTPS URL like
#      `https://safarmate-whatsapp.onrender.com` — put that in the Safarmate
#      server env as WHATSAPP_BRIDGE_URL (same token as WHATSAPP_BRIDGE_TOKEN).
#   5. Open Safarmate → Settings → WhatsApp reminders → scan the QR.

services:
  - type: web
    name: safarmate-whatsapp
    runtime: docker
    plan: free
    region: singapore                       # closest free region to India
    dockerfilePath: ./whatsapp-bridge/Dockerfile
    dockerContext: ./whatsapp-bridge
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_BRIDGE_TOKEN
        sync: false                         # you set this in the Render dashboard
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5555
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WHATSAPP_SESSION_DIR
        value: /data/wwebjs_auth
